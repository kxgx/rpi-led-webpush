name: deb 构建与发布

on:
  push:
    branches: [main, deb-packaging]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：默认只读，发布 job 单独开 write
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.codechange.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 检测代码变更（仅文档变更时跳过；打包脚本/工作流变更也会构建）
        id: codechange
        run: |
          # push 到 main / tag：始终构建（合并后 origin/main...HEAD 会为空，不能用三连点）
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "push/tag/dispatch — always build"
            exit 0
          fi
          BASE="${{ github.base_ref }}"
          git fetch --no-tags origin "$BASE" 2>/dev/null || true
          if ! git rev-parse --verify "origin/$BASE" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR：应用代码 / 打包变更 → 必须编
          if git diff --name-only "origin/$BASE...HEAD" -- . \
            ':(exclude)*.md' ':(exclude)**/*.md' \
            ':(exclude).gitignore' ':(exclude)LICENSE' > /tmp/changed.txt 2>/dev/null; then
            if [ -s /tmp/changed.txt ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "changed (incl. packaging):"; cat /tmp/changed.txt
              exit 0
            fi
          fi
          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "docs-only change — skip deb matrix"
      - name: 校验打包脚本与版本一致性
        run: |
          test -x deploy/build-deb.sh
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Cargo.toml version=$CARGO_VER"
          # tag 构建：tag 版本必须等于 Cargo.toml 版本（vX.Y.Z ↔ version = "X.Y.Z"）。
          # 忘改 Cargo.toml 就打包会让 deb 版本和 Release/tag 对不上。
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VER="${GITHUB_REF_NAME#v}"
              if [ "$TAG_VER" != "$CARGO_VER" ]; then
                echo "FAIL: tag $GITHUB_REF_NAME 与 Cargo.toml version $CARGO_VER 不一致"
                exit 1
              fi
              echo "tag/Cargo.toml 版本一致: $TAG_VER"
              ;;
          esac
          # 脚本必须使用 dpkg-deb（参考 remilia_pet_qt 约束）
          grep -q 'dpkg-deb --build' deploy/build-deb.sh
          # 服务安装到 lib/systemd/system
          grep -q 'lib/systemd/system' deploy/build-deb.sh
          echo OK

  deb-arm64:
    name: Linux ARM64 deb
    needs: [checks]
    if: needs.checks.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 .deb
        run: deploy/build-deb.sh dist
      - name: 校验 deb 产物版本
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          ls -la dist
          if ! ls dist/rpi-led-webpush_${CARGO_VER}_*.deb >/dev/null 2>&1; then
            echo "FAIL: 没找到 rpi-led-webpush_${CARGO_VER}_*.deb，产物版本与 Cargo.toml 不一致"
            exit 1
          fi
          echo "deb 产物版本: $CARGO_VER"
      - name: 上传构件
        uses: actions/upload-artifact@v7
        with:
          name: rpi-led-webpush-linux-arm64-deb
          path: dist/*.deb

  # 树莓派只需 ARM64；x86 包无硬件可跑，不在此矩阵中构建。

  release:
    name: 发布
    needs: [deb-arm64]
    # 仅官方仓库 tag 触发，防误发布（同 remilia_pet_qt）
    if: github.repository == 'kxgx/rpi-led-webpush' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: rpi-led-webpush-**
          merge-multiple: true
      - name: 列出构件
        run: ls -la
      - name: 生成校验和与变更摘要
        run: |
          echo "Build: ${{ github.ref_name }}" > sums.txt
          # 包名形如 rpi-led-webpush_<version>_arm64.deb（下划线），不能用 rpi-led-webpush-*.deb
          shopt -s nullglob
          DEBS=(*.deb)
          if [ ${#DEBS[@]} -eq 0 ]; then
            echo "FAIL: no .deb artifacts downloaded"
            ls -la
            exit 1
          fi
          sha256sum "${DEBS[@]}" >> sums.txt
          CHANGES=$(git log --abbrev=8 --abbrev-commit --pretty=format:" - %s(%h) by %an" -15)
          { echo "## 最近变更:"; echo "$CHANGES"; } > changelog.txt
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            sums.txt
            changelog.txt
          draft: false
          prerelease: false
          make_latest: true

  ci-passed:
    name: 构建门禁
    needs: [checks, deb-arm64]
    if: always() && github.repository == 'kxgx/rpi-led-webpush'
    runs-on: ubuntu-latest
    steps:
      - name: 校验结果
        run: |
          CHECKS="${{ needs.checks.result }}"
          DEB="${{ needs.deb-arm64.result }}"

          # 把 job 结果映射成直观图标（GitHub Step Summary 支持 Markdown/emoji）
          icon() {
            case "$1" in
              success)   echo "✅ 通过" ;;
              failure)   echo "❌ 失败" ;;
              cancelled) echo "⚪ 取消" ;;
              skipped)   echo "⏭️ 跳过" ;;
              *)         echo "❓ $1" ;;
            esac
          }

          FAIL=0
          # checks 必须成功；deb-arm64 必须成功，或（没代码变更时）允许跳过
          [ "$CHECKS" = "success" ] || FAIL=1
          case "$DEB" in
            success|skipped) ;;
            *) FAIL=1 ;;
          esac

          if [ "$FAIL" = "1" ]; then
            {
              echo "## ❌ 门禁失败"
              echo ""
              echo "| 检查项 | 结果 |"
              echo "|---|---|"
              echo "| 变更检测 checks | $(icon "$CHECKS") |"
              echo "| ARM64 deb 构建 | $(icon "$DEB") |"
              echo ""
              echo "> 门禁未通过：请展开失败的 job 查看日志。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::❌ 门禁失败（checks: $(icon "$CHECKS") / deb-arm64: $(icon "$DEB")）"
            exit 1
          fi

          {
            echo "## ✅ 门禁通过"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "|---|---|"
            echo "| 变更检测 checks | $(icon "$CHECKS") |"
            echo "| ARM64 deb 构建 | $(icon "$DEB") |"
            if [ "$DEB" = "skipped" ]; then
              echo ""
              echo "> ⏭️ 仅文档变更，已跳过 deb 构建。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ 门禁通过"
